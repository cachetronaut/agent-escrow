<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentEscrow | Testnet walkthrough</title>
<link rel="stylesheet" href="/stage.css">
</head>
<body>
<header class="top">
  <div class="brand"><strong>AgentEscrow</strong><span>Escrow for AI-agent work, with a warranty hold.</span></div>
  <div class="meta" id="meta">NEAR testnet</div>
</header>
<main class="stage">
  <section class="scene" id="scene" aria-label="Animated diagram of client, escrow vault, worker and verifier">
    <p class="scene-note" id="scene-note"></p>
  </section>
  <section class="panel" id="panel" aria-live="polite">
    <p class="count" id="count"></p>
    <h1 id="step-title"></h1>
    <p class="headline" id="headline"></p>
    <div id="facts"></div>
  </section>
</main>
<nav class="stepper" aria-label="Walkthrough steps">
  <ol id="steps"></ol>
  <div class="controls">
    <button id="prev" type="button" aria-label="Previous step">←</button>
    <button id="play" type="button">Play</button>
    <button id="next" type="button" aria-label="Next step">→</button>
  </div>
  <div class="progress"><span id="progress"></span></div>
</nav>
<footer class="foot" id="foot"></footer>
<script type="module" src="/stage.mjs"></script>
</body>
</html>
